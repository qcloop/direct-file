name: MCP checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  calculator:
    name: MCP checks
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      REDIS_URL: redis://localhost:6379
    services:
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: corretto
          java-version: '25'
      - name: Build pinned dependencies and run Java checks
        run: bash .github/scripts/test-mcp.sh
      - name: Build production image
        run: docker build -t tax-advisor-ci -f direct-file/tax-advisor/Dockerfile direct-file
      - name: Verify health and MCP transport
        run: python3 .github/scripts/smoke-mcp.py tax-advisor-ci

# Delivery is owned by AWS CodePipeline. These PR checks have no AWS credentials.
