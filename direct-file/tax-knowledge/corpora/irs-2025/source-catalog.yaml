production_notes:
  - AI agents may draft segmentation, topics, questions, evidence maps, conflicts, and scenarios from these sources.
  - Human tax specialists must approve tax interpretation before any generated artifact is compiled into runtime behavior.
  - Source URLs using irs-pdf paths point to latest current PDFs. Preserve retrieval dates and checksums when downloading files.
  - The IRS static PDF directory exposes current PDFs. For older tax years, verify whether the current irs-pdf filename still carries the target revision before using it as an authoritative source.
  - MeF schema packages and full business-rule packages may require Secure Object Repository access even when the public release memo and version table are visible.
