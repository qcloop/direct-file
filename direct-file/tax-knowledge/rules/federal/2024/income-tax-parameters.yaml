  - irc_63
  - irs_rev_proc_2023_34
description: >
  Year/filing-status-scoped federal ordinary income-tax schedule for 2024: standard deduction, the
  six bracket ceilings (top of brackets 1-6; bracket 7 is open-ended), and the seven statutory
  marginal rates. Dollar figures are the 2024 inflation-adjusted amounts from IRS Rev. Proc. 2023-34;
  rates are the statutory IRC 1(j) rates. Ordinary income only — no capital-gains rates, credits,
  NIIT, or AMT.
parameters:
