    name: First bracket marginal rate (10%)
    type: rational
    value: "10/100"
    source_id: irc_1
    note: 10% — lowest ordinary-income bracket. Statutory rate (IRC 1(j)).
  - fact_path: /incomeTax/bracket2Rate
    name: Second bracket marginal rate (12%)
    type: rational
