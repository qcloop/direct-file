parameter_set_id: income_tax_parameters_ty2025
tax_year: 2025
jurisdiction: federal
topic_id: income_tax
status: published
source_ids:
  - irc_1
  - irc_63
  - irs_rev_proc_2024_40
description: >
  Year/filing-status-scoped federal ordinary income-tax schedule: the standard deduction and the
  seven ordinary-rate bracket ceilings (the top of brackets 1-6; bracket 7 is open-ended) plus the
  seven marginal rates. The planning service injects the standard deduction and the bracket ceilings
  for the session's filing status, and the (status-invariant) rates always. These let the graph
  DERIVE projected income tax and total tax instead of accepting an agent-supplied guess.

  Bracket ceilings and the standard deduction are the 2025 inflation-adjusted figures from IRS
  Rev. Proc. 2024-40; the marginal rates are the statutory IRC 1(j) rates. Scope is ordinary income
  only: capital-gains/qualified-dividend rates, credits, NIIT, and AMT are not modeled here.
parameters:
  # Seven marginal rates (status-invariant: the rate schedule is the same for every filing status;
  # only the dollar ceilings differ). IRC 1(j).
  - fact_path: /incomeTax/bracket1Rate
    name: First bracket marginal rate (10%)
    type: rational
    value: "10/100"
    source_id: irc_1
    note: 10% — lowest ordinary-income bracket. Statutory rate (IRC 1(j)).
  - fact_path: /incomeTax/bracket2Rate
    name: Second bracket marginal rate (12%)
    type: rational
    value: "12/100"
    source_id: irc_1
    note: 12% ordinary-income bracket. Statutory rate (IRC 1(j)).
  - fact_path: /incomeTax/bracket3Rate
    name: Third bracket marginal rate (22%)
    type: rational
    value: "22/100"
    source_id: irc_1
    note: 22% ordinary-income bracket. Statutory rate (IRC 1(j)).
  - fact_path: /incomeTax/bracket4Rate
    name: Fourth bracket marginal rate (24%)
    type: rational
    value: "24/100"
    source_id: irc_1
