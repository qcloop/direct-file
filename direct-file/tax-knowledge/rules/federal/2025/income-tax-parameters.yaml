    type: rational
    value: "37/100"
    source_id: irc_1
    note: 37% — top ordinary-income bracket. Statutory rate (IRC 1(j)).

  # Standard deduction — filing-status-scoped (IRC 63; 2025 amounts from Rev. Proc. 2024-40).
  - fact_path: /standardDeduction
    name: Standard deduction (single)
    type: dollar
    value: "15000"
    unit: dollars
    filing_status: single
    source_id: irs_rev_proc_2024_40
    note: Single / married filing separately — 2025 standard deduction is $15,000 (Rev. Proc. 2024-40).
  - fact_path: /standardDeduction
    name: Standard deduction (married filing jointly)
    type: dollar
    value: "30000"
    unit: dollars
    filing_status: mfj
    source_id: irs_rev_proc_2024_40
    note: Married filing jointly — 2025 standard deduction is $30,000 (Rev. Proc. 2024-40).
  - fact_path: /standardDeduction
