description: >
  Federal ordinary-income brackets and basic standard deductions for 2026, verified against
  Rev. Proc. 2025-32. Draft pending human tax review. This planning model excludes credits,
  preferential capital-gains rates, itemized deductions, NIIT, AMT, and additional personal deductions.
