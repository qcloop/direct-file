  - irs_rev_proc_2025_32
description: >
  Federal ordinary income-tax schedule for tax year 2026. STATUS IS DRAFT: the seven marginal rates
  are the statutory IRC 1(j) rates (confident), but the dollar figures — the standard deduction and
  the bracket ceilings — are PROVISIONAL (Rev. Proc. 2025-32, reflecting post-OBBBA amounts) and must
  be confirmed against the final 2026 IRS figures before this set is promoted to published. Ordinary
  income only; no capital-gains rates, credits, NIIT, or AMT.
parameters:
