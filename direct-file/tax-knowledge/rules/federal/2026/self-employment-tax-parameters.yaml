parameter_set_id: self_employment_tax_parameters_ty2026
tax_year: 2026
jurisdiction: federal
status: draft
source_ids:
  - irs_instruction_1040_schedule_c_2026
  - irs_instruction_1040_schedule_se_2026
  - irs_form_1040_es_2026
  - ssa_cola_announcement_2026
  - irs_form_8959_2026
  - irc_1401b2
description: >
  Federal self-employment tax constants for tax year 2026. STATUS IS DRAFT: the statutory values
  here (FICA component rates, the $400 SE filing threshold, the $150,000 high-income safe-harbor
  AGI threshold) are year-invariant and confident, but the two year-indexed figures —
  standardMileageRate and socialSecurityWageBase — are PROVISIONAL and must be confirmed against
  the official 2026 IRS and SSA announcements before this set is promoted to published. The values
  below let 2026 planning sessions run, but treat the mileage rate and wage base as estimates until
  verified. See the per-parameter notes.
parameters:
  - fact_path: /standardMileageRate
    name: Business standard mileage rate
    type: rational
    value: "725/1000"
    unit: dollars_per_mile
    provisional: true
    source_id: irs_instruction_1040_schedule_c_2026
    note: >
      PROVISIONAL 2026 business standard mileage rate (72.5 cents/mile = 725/1000 dollars/mile).
      Modeled as a Rational so the half-cent is exact (a Dollar would round it to 0.72). Confirm
      against the official IRS 2026 announcement before publishing; do not treat as authoritative yet.
  - fact_path: /socialSecurityWageBase
    name: Social Security wage base
    type: dollar
    value: "184500"
    unit: dollars
    provisional: true
    source_id: ssa_cola_announcement_2026
    note: >
      PROVISIONAL 2026 Social Security taxable maximum. Confirm against the SSA Contribution and
      Benefit Base announcement (released October 2025) before publishing; do not treat as
      authoritative yet.
  - fact_path: /seFilingThreshold
    name: Self-employment tax filing threshold
    type: dollar
    value: "400"
    unit: dollars
    source_id: irs_instruction_1040_schedule_se_2026
    note: Net SE earnings at or above $400 trigger SE tax. Statutory; not indexed.
  - fact_path: /highIncomeSafeHarborThreshold
    name: High-income safe-harbor AGI threshold
    type: dollar
    value: "150000"
    unit: dollars
    source_id: irs_form_1040_es_2026
    note: Prior-year AGI above $150,000 requires 110% (not 100%) safe-harbor coverage (IRC 6654). Statutory.
  - fact_path: /seSocialSecurityRate
    name: Social Security portion of SE tax rate
    type: rational
    value: "124/1000"
    source_id: irs_instruction_1040_schedule_se_2026
    note: 12.4% Social Security component of self-employment tax. Statutory rate.
  - fact_path: /seMedicareRate
    name: Medicare portion of SE tax rate
    type: rational
    value: "29/1000"
    source_id: irs_instruction_1040_schedule_se_2026
    note: 2.9% Medicare component of self-employment tax. Statutory rate.
  - fact_path: /seWageMultiplier
    name: Net earnings multiplier
    type: rational
    value: "9235/10000"
    source_id: irs_instruction_1040_schedule_se_2026
    note: 92.35% net-earnings multiplier (removes the employer-equivalent half of FICA from the SE base). Statutory.
  # Additional Medicare Tax (Form 8959). Rate is statutory (0.9%); thresholds are by filing status
  # and are NOT inflation-indexed (unchanged since 2013), so they carry over to 2026 unchanged. The
  # /additionalMedicareThreshold rows are status-scoped: only the one matching the session's filing
  # status is injected.
  - fact_path: /additionalMedicareRate
    name: Additional Medicare Tax rate
    type: rational
    value: "9/1000"
    source_id: irc_1401b2
    note: 0.9% Additional Medicare Tax on Medicare wages + SE income above the filing-status threshold (Form 8959).
  - fact_path: /additionalMedicareThreshold
    name: Additional Medicare Tax threshold (single)
    type: dollar
    value: "200000"
    unit: dollars
    filing_status: single
    source_id: irs_form_8959_2026
    note: Single / head of household / qualifying surviving spouse — 0.9% surtax applies above $200,000.
  - fact_path: /additionalMedicareThreshold
    name: Additional Medicare Tax threshold (married filing jointly)
    type: dollar
    value: "250000"
    unit: dollars
    filing_status: mfj
    source_id: irs_form_8959_2026
    note: Married filing jointly — threshold is $250,000.
  - fact_path: /additionalMedicareThreshold
    name: Additional Medicare Tax threshold (married filing separately)
    type: dollar
    value: "125000"
    unit: dollars
    filing_status: mfs
    source_id: irs_form_8959_2026
    note: Married filing separately — threshold is $125,000.
