parameter_set_id: "self_employment_tax_parameters_ty2026"
tax_year: 2026
jurisdiction: "federal"
status: "draft"
source_ids:
  - "irs_notice_2026_10"
  - "irs_announcement_2026_11"
  - "irs_instruction_1040_schedule_se_2026"
  - "irs_form_1040_es_2026"
  - "irs_rev_proc_2025_32"
  - "irc_1401b2"
  - "irc_199a"
  - "irc_199a_2026_snapshot"
  - "irc_1401_2026_snapshot"
description: "Verified 2026 federal planning constants. Draft pending human tax review. Mileage has two effective periods; QBI above the simple-method threshold remains an upper-bound estimate."
parameters:
  - fact_path: "/standardMileageRate"
    name: "Business standard mileage rate"
    type: "rational"
    value: "725/1000"
    unit: "dollars_per_mile"
    source_id: "irs_notice_2026_10"
    note: "72.5 cents per mile for January 1 through June 30, 2026; exact rational dollars per mile."
  - fact_path: "/socialSecurityWageBase"
    name: "Social Security wage base"
    type: "dollar"
    value: "184500"
    unit: "dollars"
    source_id: "irs_instruction_1040_schedule_se_2026"
    note: "2026 Social Security taxable maximum, verified against the final 2026 Schedule SE instructions."
  - fact_path: "/seFilingThreshold"
    name: "Self-employment tax filing threshold"
    type: "dollar"
    value: "400"
    unit: "dollars"
    source_id: "irs_instruction_1040_schedule_se_2026"
    note: "Net SE earnings at or above $400 trigger SE tax. Statutory; not indexed."
  - fact_path: "/highIncomeSafeHarborThreshold"
    name: "High-income safe-harbor AGI threshold (single)"
    type: "dollar"
    value: "150000"
    unit: "dollars"
    filing_status: "single"
    source_id: "irs_form_1040_es_2026"
    note: "Prior-year AGI above this threshold requires the 110% prior-year safe harbor."
  - fact_path: "/highIncomeSafeHarborThreshold"
    name: "High-income safe-harbor AGI threshold (mfj)"
    type: "dollar"
    value: "150000"
    unit: "dollars"
    filing_status: "mfj"
    source_id: "irs_form_1040_es_2026"
    note: "Prior-year AGI above this threshold requires the 110% prior-year safe harbor."
  - fact_path: "/highIncomeSafeHarborThreshold"
    name: "High-income safe-harbor AGI threshold (mfs)"
    type: "dollar"
    value: "75000"
    unit: "dollars"
    filing_status: "mfs"
    source_id: "irs_form_1040_es_2026"
    note: "Prior-year AGI above this threshold requires the 110% prior-year safe harbor."
  - fact_path: "/seSocialSecurityRate"
    name: "Social Security portion of SE tax rate"
    type: "rational"
    value: "124/1000"
    source_id: "irs_form_1040_es_2026"
    note: "12.4% Social Security component of self-employment tax. Statutory rate."
  - fact_path: "/seMedicareRate"
    name: "Medicare portion of SE tax rate"
    type: "rational"
    value: "29/1000"
    source_id: "irs_form_1040_es_2026"
    note: "2.9% Medicare component of self-employment tax. Statutory rate."
  - fact_path: "/seWageMultiplier"
    name: "Net earnings multiplier"
    type: "rational"
    value: "9235/10000"
    source_id: "irs_form_1040_es_2026"
    note: "92.35% net-earnings multiplier (removes the employer-equivalent half of FICA from the SE base). Statutory."
  - fact_path: "/additionalMedicareRate"
    name: "Additional Medicare Tax rate"
    type: "rational"
    value: "9/1000"
    source_id: "irc_1401_2026_snapshot"
    note: "0.9% Additional Medicare Tax on Medicare wages + SE income above the filing-status threshold (Form 8959)."
  - fact_path: "/additionalMedicareThreshold"
    name: "Additional Medicare Tax threshold (single)"
    type: "dollar"
    value: "200000"
    unit: "dollars"
    filing_status: "single"
    source_id: "irc_1401_2026_snapshot"
    note: "Single / head of household / qualifying surviving spouse — 0.9% surtax applies above $200,000."
  - fact_path: "/additionalMedicareThreshold"
    name: "Additional Medicare Tax threshold (married filing jointly)"
    type: "dollar"
    value: "250000"
    unit: "dollars"
    filing_status: "mfj"
    source_id: "irc_1401_2026_snapshot"
    note: "Married filing jointly — threshold is $250,000."
  - fact_path: "/additionalMedicareThreshold"
    name: "Additional Medicare Tax threshold (married filing separately)"
    type: "dollar"
    value: "125000"
    unit: "dollars"
    filing_status: "mfs"
    source_id: "irc_1401_2026_snapshot"
    note: "Married filing separately — threshold is $125,000."
  - fact_path: "/qbiRate"
    name: "QBI deduction rate"
    type: "rational"
    value: "1/5"
    source_id: "irc_199a"
    note: "20% qualified business income deduction under IRC 199A. Statutory."
  - fact_path: "/qbiThreshold"
    name: "QBI taxable-income threshold (single)"
    type: "dollar"
    value: "201750"
    unit: "dollars"
    filing_status: "single"
    source_id: "irs_rev_proc_2025_32"
    note: "2026 simple-method threshold; Rev. Proc. 2025-32 section 4.26. MFS differs from single."
  - fact_path: "/qbiThreshold"
    name: "QBI taxable-income threshold (married filing jointly)"
    type: "dollar"
    value: "403500"
    unit: "dollars"
    filing_status: "mfj"
    source_id: "irs_rev_proc_2025_32"
    note: "2026 simple-method threshold; Rev. Proc. 2025-32 section 4.26. MFS differs from single."
  - fact_path: "/qbiThreshold"
    name: "QBI taxable-income threshold (married filing separately)"
    type: "dollar"
    value: "201775"
    unit: "dollars"
    filing_status: "mfs"
    source_id: "irs_rev_proc_2025_32"
    note: "2026 simple-method threshold; Rev. Proc. 2025-32 section 4.26. MFS differs from single."
  - fact_path: "/seMileageSplitRate"
    name: "Mileage rate changes within this income year"
    type: "boolean"
    value: "true"
    source_id: "irs_announcement_2026_11"
  - fact_path: "/seMileageChangeMonth"
    name: "Month the second mileage rate starts"
    type: "int"
    value: "7"
    source_id: "irs_announcement_2026_11"
  - fact_path: "/qbiMinimumDeduction"
    name: "Minimum deduction for eligible active QBI"
    type: "dollar"
    value: "400"
    source_id: "irc_199a_2026_snapshot"
  - fact_path: "/qbiMinimumIncome"
    name: "Minimum active QBI required for the minimum deduction"
    type: "dollar"
    value: "1000"
    source_id: "irc_199a_2026_snapshot"
  - fact_path: "/standardMileageRateAfterChange"
    name: "Business mileage rate from July 1, 2026"
    type: "rational"
    value: "76/100"
    unit: "dollars_per_mile"
    source_id: "irs_announcement_2026_11"
    note: "76 cents per mile for July 1 through December 31, 2026."
