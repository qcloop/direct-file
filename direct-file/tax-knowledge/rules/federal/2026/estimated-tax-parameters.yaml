description: >
  Year-indexed IRC §6654 estimated-tax safe-harbor percentages. Merged with the other
  *-tax-parameters.yaml for this year by the topic-agnostic loader and injected into the
  session fact graph at the given fact_path. These percentages are statutory and do not vary by
  year, so this set is published; only the self-employment set's dollar figures are provisional
  for 2026.
parameters:
  - fact_path: /planning/highIncomeSafeHarborRate
    name: High-income prior-year safe-harbor rate
    type: rational
    value: "110/100"
    source_id: irc_6654
    note: 110% of prior-year tax when prior-year AGI exceeds the high-income threshold (IRC 6654(d)(1)(C)).
  - fact_path: /planning/currentYearSafeHarborRate
    name: Current-year safe-harbor rate
    type: rational
    value: "90/100"
    source_id: irc_6654
    note: 90% of projected current-year tax — the alternative safe-harbor leg (IRC 6654(d)(1)(B)).
