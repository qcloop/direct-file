registry_id: federal_citations
jurisdiction: federal
description: >
  Maps each source_id used by planner tax parameters and rules to a formal legal
  citation and a plain-language, friendly explanation. The planner resolves these
  to (a) show the authority behind every statutory constant and computed result in
  the taxpayer export and (b) answer "why / on what basis" via the cite tool.
  Statute entries are year-independent; form / instruction / announcement ids embed
  the year, so add a new dated entry when a new tax year's parameters are published.
  Keep plain_language friendly and simple (about an 8th-grade reading level); the
  formal citation field carries the precision.
citations:
  irc_6654:
    authority: statute
    citation: "26 U.S.C. § 6654"
    title: "Failure by individual to pay estimated income tax"
    url: "https://www.law.cornell.edu/uscode/text/26/6654"
    plain_language: >
      The rule that says you should pay your tax during the year, not all at once at
      the end. If a job isn't taking enough out of your pay, you send the IRS
      quarterly payments. Pay at least a "safe" amount as you go and the IRS won't
      charge you an extra penalty for underpaying.

  irc_1401:
    authority: statute
    citation: "26 U.S.C. § 1401"
    title: "Rate of tax (self-employment tax)"
    url: "https://www.law.cornell.edu/uscode/text/26/1401"
    plain_language: >
      When you work for yourself, you pay both halves of Social Security and Medicare
      that an employer would normally split with you. This is the law that sets those
      rates — 12.4% for Social Security and 2.9% for Medicare — together known as
      self-employment tax.

  irs_form_1040_es_2024:
    authority: form
    citation: "IRS Form 1040-ES (2024), Estimated Tax for Individuals"
    title: "Estimated Tax for Individuals"
    url: "https://www.irs.gov/forms-pubs/about-form-1040-es"
    plain_language: >
      The IRS worksheet for figuring and mailing in quarterly tax payments when you
      don't have an employer withholding tax for you. It also spells out the
      "safe harbor" amounts that keep you out of penalty territory.

  irs_form_1040_es_2025:
    authority: form
    citation: "IRS Form 1040-ES (2025), Estimated Tax for Individuals"
    title: "Estimated Tax for Individuals"
    url: "https://www.irs.gov/forms-pubs/about-form-1040-es"
    plain_language: >
      The IRS worksheet for figuring and mailing in quarterly tax payments when you
      don't have an employer withholding tax for you. It also spells out the
      "safe harbor" amounts that keep you out of penalty territory.

  irs_instruction_1040_schedule_c_2024:
    authority: instruction
    citation: "Instructions for Schedule C (Form 1040) (2024), Profit or Loss From Business"
    title: "Profit or Loss From Business (Sole Proprietorship)"
    url: "https://www.irs.gov/forms-pubs/about-schedule-c-form-1040"
    plain_language: >
      The instructions for reporting money you made and spent running your own
      business. They include the standard mileage rate you can use instead of
      tracking every car expense.

  irs_instruction_1040_schedule_c_2025:
    authority: instruction
    citation: "Instructions for Schedule C (Form 1040) (2025), Profit or Loss From Business"
    title: "Profit or Loss From Business (Sole Proprietorship)"
    url: "https://www.irs.gov/forms-pubs/about-schedule-c-form-1040"
    plain_language: >
      The instructions for reporting money you made and spent running your own
      business. They include the standard mileage rate you can use instead of
      tracking every car expense.

  irs_instruction_1040_schedule_se_2024:
    authority: instruction
    citation: "Instructions for Schedule SE (Form 1040) (2024), Self-Employment Tax"
    title: "Self-Employment Tax"
    url: "https://www.irs.gov/forms-pubs/about-schedule-se-form-1040"
    plain_language: >
      The step-by-step for figuring self-employment tax: multiply your net profit by
      92.35% to get net earnings, then apply the Social Security and Medicare rates.
      Earn less than $400 and you generally skip this tax.

  irs_instruction_1040_schedule_se_2025:
    authority: instruction
    citation: "Instructions for Schedule SE (Form 1040) (2025), Self-Employment Tax"
    title: "Self-Employment Tax"
    url: "https://www.irs.gov/forms-pubs/about-schedule-se-form-1040"
    plain_language: >
      The step-by-step for figuring self-employment tax: multiply your net profit by
