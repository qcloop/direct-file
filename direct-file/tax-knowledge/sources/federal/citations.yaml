  ssa_cola_announcement_2024:
    authority: agency_announcement
    citation: "Social Security Administration, 2024 Contribution and Benefit Base"
    title: "Social Security wage base (2024)"
    url: "https://www.ssa.gov/oact/cola/cbb.html"
    plain_language: >
      Each year the Social Security Administration sets the most income that can be
      taxed for Social Security. For 2024 that cap is $168,600 — earnings above it
      aren't charged the Social Security part of the tax (Medicare has no cap).

  ssa_cola_announcement_2025:
