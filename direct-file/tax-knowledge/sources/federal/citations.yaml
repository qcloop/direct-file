  irs_publication_334_2025:
    authority: publication
    citation: "IRS Publication 334 (2025), Tax Guide for Small Business"
    title: "Tax Guide for Small Business (For Individuals Who Use Schedule C)"
    url: "https://www.irs.gov/forms-pubs/about-publication-334"
    plain_language: >
      A plain-English guidebook from the IRS for people running a small business or
      side gig — what counts as income, which expenses you can deduct, and how it all
      lands on your tax return.

  irs_publication_463_2025:
    authority: publication
    citation: "IRS Publication 463 (2025), Travel, Gift, and Car Expenses"
    title: "Travel, Gift, and Car Expenses"
    url: "https://www.irs.gov/forms-pubs/about-publication-463"
    plain_language: >
      The IRS guide to deducting car and travel costs for work. It explains the two
      ways to write off driving — the simple standard mileage rate, or adding up your
      actual gas, repairs, and insurance.

