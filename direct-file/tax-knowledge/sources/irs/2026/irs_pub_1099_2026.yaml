      Future Developments
      For the latest information about developments related to
      Publication 1099 Pub. 1099, such as legislation enacted after it was pub-
      lished, go to IRS.gov/Pub1099.
      General What’s New
      Instructions Address fields on forms.  For forms revised in 2026, we
      for Certain separated the address fields into individual entry boxes.
      Cash tips and overtime compensation.  Forms
      1099-MISC and 1099-NEC have been updated to allow
      Information reporting of cash tips, Treasury Tipped Occupation Code,
      and overtime compensation.
      Returns Form 1099-K has been updated to allow for the report-
      ing of cash tips and the applicable Treasury Tipped Occu-
      pation Code.
      (Forms 1096, 1097, 1098, Continuous-use forms and instructions.  Forms
      5498-ESA, 5498-QA, and 5498-SA and their separate in-
      1099, 3921, 3922, 5498, structions are now continuous use. As a result, they will no
      longer be issued annually and will only be revised when
      and W-2G) changes are required.
      For use in preparing E-file/Retirement of the Filing Information Returns
      Electronically (FIRE) system.  Beginning tax year 2026/
      2026 filing season 2027, the Information Returns Intake System
      Returns (IRIS) will be the only intake system for information re-
      turns. You are strongly encouraged to complete your IRIS
      application for Transmitter Control Code (TCC) and begin
      transitioning to IRIS to ensure you are ready for the 2027
      filing season. FIRE will not be available for submissions
      (current, prior year, or corrections) once the system shuts
      down in 2026 for end of year. References to FIRE and
      Pub. 1220 have been removed from this publication. The
      typical TCC application will be processed within 45 busi-
      ness days, however, processing times may vary.
      Form 1096. Form 1096 has been revised to reflect the
      addition of new Form 1098-VLI due to section 6050AA.
      Form 1098-MA.  The Hardest Hit Fund, Short Refinance,
      and Making Home Affordable programs are expired and
      out of funding. As such, Form 1098-MA is being retired
      and made historical. References to Form 1098-MA have
      been removed from this publication.
      Form 1098-VLI.  Section 6050AA requires lenders or
      other recipients that receive $600 or more of specified
      passenger vehicle loan (SPVL) interest to file information
      returns with the IRS and furnish statements to taxpayers
      showing the total amount of SPVL interest received during
      the calendar year. To facilitate this filing and furnishing re-
      quirement, the IRS issued new Form 1098-VLI, Vehicle
      Loan Interest Statement. Information about new Form
      1098-VLI has been added to this publication, where ap-
