    text: "We have converted the General Instructions for Certain Information Returns (Forms 1096, 1097, 1098, 1099, 3921, 3922, 5498, and W-2G) from instructions to a publication. The new publication is named Publication 1099, General Instructions for Certain Information Returns (Forms 1096, 1097, 1098, 1099, 3921, 3922, 5498, and W-2G). This change is effective for tax year 2026 processing year 2027."
