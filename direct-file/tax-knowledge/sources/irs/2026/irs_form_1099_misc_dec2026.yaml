    title: "Miscellaneous Information"
    pages:
      - 1
    heading: "Attention:"
    text: |
      Attention:
      Which Revision To Use for Which Year. We issue information returns up to a year in
      advance of when issuers will first file them. For all forms that we do not issue annually (such
      as Form 1040), the year of the revision date is the first year for which issuers are to use the
      form to report amounts. For example, we issued an April 2025 revision of Form 1099-NEC,
      Nonemployee Compensation, to use first to report amounts for calendar year 2025. Filers will
      first file the April 2025 revision with the IRS beginning in January 2026, to report amounts for
      2025. Likewise, we are developing a December 2026 revision of Form 1099-NEC, to use first
      to report amounts for calendar year 2026 with the first filings with the IRS beginning in
      January 2027.
      We release these and other information return forms and their instructions up to a year in
      advance of when you, as an issuer, are required to file them with the IRS. We do this because
      the information return forms have multiple uses. We also provide a copy of the form for the
      form issuer to use to furnish a copy of the form to the recipient. We require filers of
      information returns, including Forms 1099-NEC and 1099-S, to furnish a copy of what is or will
      be filed with the IRS to the recipient. In many cases, issuers of 1099 forms prefer to furnish
      the information return to the recipient at the time they know what they will have to report to the
      IRS beginning the following January. For example, you cannot file the December 2026
      revision of Form 1099-S with the IRS for a reportable home sale occurring in January 2026
      until January 2027. However, you may want to furnish the recipient (the seller of the home)
      their copy of Form 1099-S at the closing of the sale, to avoid issues with mailing the Form
      1099-S the following January, a year later, when the recipient may have a new mailing
      address. We therefore make the Form 1099-S for use in reporting 2026 sales available just
      before 2026, so issuers can use it to meet their responsibility to furnish a copy to the recipient
      for sales beginning in 2026, even though the form can’t be filed with the IRS until January
      2027. We also post drafts and final revisions of information returns well in advance so that
      issuers will know at the beginning of a year what information they need to collect during that
      year so they can report it to the IRS beginning in January of the following year.
      Note: We make available Copy A for informational purposes only. Copy A appears in red,
      similar to the official printed form. However, official printed versions of Copy A are scannable,
      but self-printed copies of Copy A from this PDF are not. Do not print and file copy A of this
      PDF; we may impose a penalty for filing information return forms that we can’t scan. See part
      O in Publication 1099, General Instructions for Certain Information Returns, at
      IRS.gov/Form1099 for more information about penalties.
      You may download and print Copy B and other copies of this form, which appear in black, to
      satisfy the requirement to furnish the information to the recipient.
      If you have 10 or more information returns, in the aggregate, to file, you may be required to
      e-file information returns. You’ll find that it is easier and faster to e-file using our free
      Information Return Intake System (IRIS). See IRS.gov/InfoReturn and IRS.gov/IRIS for details.
      To order official IRS information returns, which include a scannable Copy A for filing with the
      IRS and all other applicable copies of the form, go to IRS.gov/EmployerForms. We’ll mail you
      the forms you request and their instructions, as well as any publications you may order.
      Note: The order limit for most information returns is 10 due to the e-file requirement.
      See IRS Publications 1141, 1167, and 1179 for more information about these tax forms.
