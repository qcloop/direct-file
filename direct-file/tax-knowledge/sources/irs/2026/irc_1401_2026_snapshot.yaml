      1961⁠—Pub. L. 87-64 increased the rate of tax for taxable years beginning after Dec. 31, 1961, and before Jan. 1, 1963, from 4½ to 4.7 percent, taxable years beginning after Dec. 31, 1962, and before Jan. 1, 1966, from 5¼ to 5.4 percent, taxable years beginning after Dec. 31, 1965, and before Jan. 1, 1968, from 6 to 6.2 percent, taxable year beginning after Dec. 31, 1967, and before Jan. 1, 1969, from 6 to 6.9 percent, and taxable years beginning after Dec. 31, 1968, from 6¾ to 6.9 percent.
      1958⁠—Pub. L. 85-840 increased the rate of tax by substituting provisions imposing a tax of 3¾ percent for taxable years beginning after Dec. 31, 1958, 4½ percent for years beginning after Dec. 31, 1959, 5¼ percent for years beginning after Dec. 31, 1962, 6 percent for years beginning after Dec. 31, 1965, and 6¾ percent for years beginning after Dec. 31, 1968, for provisions which imposed a tax of 3⅜ percent for taxable years beginning after Dec. 31, 1956, 4⅛ percent for years beginning after Dec. 31, 1959, 4⅞ percent for years beginning after Dec. 31, 1964, 5⅝ percent for years beginning after Dec. 31, 1969, and 6⅜ percent for years beginning after Dec. 31, 1974.
      1956⁠—Act Aug. 1, 1956, increased the rate of tax for all taxable years beginning after Dec. 31, 1956, by three-eighths percent.
      1954⁠—Act Sept. 1, 1954, increased the 4⅞ percent rate of tax on self-employment income for taxable years beginning after Dec. 31, 1969, to 5¼ percent for taxable years beginning after Dec. 31, 1969, and before Jan. 1, 1975, and 6 percent for taxable years beginning after Dec. 31, 1974.
