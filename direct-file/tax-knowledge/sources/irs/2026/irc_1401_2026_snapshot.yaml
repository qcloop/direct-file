    heading: "Credit for Sick Leave for Certain Self-Employed Individuals"
    text: |
      Credit for Sick Leave for Certain Self-Employed Individuals
      Pub. L. 117-2, title IX, § 9642, Mar. 11, 2021, 135 Stat. 171, provided that:
      “(a)  In General.⁠—In the case of an eligible self-employed individual, there shall be allowed as a credit against the tax imposed by chapter 1 of the Internal Revenue Code of 1986 for any taxable year an amount equal to the qualified sick leave equivalent amount with respect to the individual.
      “(b)  Eligible Self-employed Individual.⁠—For purposes of this section⁠—
      “(1)  In general.⁠—The term ‘eligible self-employed individual’ means an individual who⁠—
      “(A)  regularly carries on any trade or business within the meaning of section 1402 of the Internal Revenue Code of 1986, and
      “(B)  would be entitled to receive paid leave during the taxable year pursuant to the Emergency Paid Sick Leave Act [div. E (§ 5101 et seq.) of Pub. L. 116-127, 29 U.S.C. 2601 note] if⁠—
      “(i)  the individual were an employee of an employer (other than himself or herself), and
      “(ii)  such Act applied after March 31, 2021.
      “(2)  Rules of application.⁠—For purposes of paragraph (1)(B), in determining whether an individual would be entitled to receive paid leave under the Emergency Paid Sick Leave Act, such Act shall be applied⁠—
      “(A)  by inserting ‘, the employee is seeking or awaiting the results of a diagnostic test for, or a medical diagnosis of, COVID–19 and such employee has been exposed to COVID–19 or is unable to work pending the results of such test or diagnosis, or the employee is obtaining immunization related to COVID–19 or recovering from any injury, disability, illness, or condition related to such immunization’ after ‘medical diagnosis’ in section 5102(a)(3) of such Act, and
      “(B)  by applying section 5102(b)(1) of such Act separately with respect to each taxable year.
      “(c)  Qualified Sick Leave Equivalent Amount.⁠—For purposes of this section⁠—
      “(1)  In general.⁠—The term ‘qualified sick leave equivalent amount’ means, with respect to any eligible self-employed individual, an amount equal to⁠—
      “(A)  the number of days during the taxable year (but not more than 10) that the individual is unable to perform services in any trade or business referred to in section 1402 of the Internal Revenue Code of 1986 for a reason with respect to which such individual would be entitled to receive sick leave as described in subsection (b), multiplied by
      “(B)  the lesser of⁠—
      “(i)  $200 ($511 in the case of any day of paid sick time described in paragraph (1), (2), or (3) of section 5102(a) of the Emergency Paid Sick Leave Act, applied with the modification described in subsection (b)(2)(A)) of this section, or
    text_sha256: "22274375412d24481c82850d8b1b87a461e8c3001d928fe52a945f596a7e295c"
    source_url: "https://uscode.house.gov/us/usc/119-124/t26/s1401/"
