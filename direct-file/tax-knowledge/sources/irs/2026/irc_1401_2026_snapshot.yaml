      “(A)  the number of days (not to exceed 60) during the taxable year that the individual is unable to perform services in any trade or business referred to in section 1402 of the Internal Revenue Code of 1986 for a reason with respect to which such individual would be entitled to receive paid leave as described in subsection (b) of this section, multiplied by
      “(B)  the lesser of⁠—
      “(i)  67 percent of the average daily self-employment income of the individual for the taxable year, or
      “(ii)  $200.
      “(2)  Average daily self-employment income.⁠—For purposes of this subsection, the term ‘average daily self-employment income’ means an amount equal to⁠—
      “(A)  the net earnings from self-employment income of the individual for the taxable year, divided by
      “(B)  260.
      “(3)  Election to use prior year net earnings from self-employment income.⁠—In the case of an individual who elects (at such time and in such manner as the Secretary may provide) the application of this paragraph, paragraph (2)(A) shall be applied by substituting ‘the prior taxable year’ for ‘the taxable year’.
      “(4)  Coordination with credit for sick leave.⁠—Any day taken into account in determining the qualified sick leave equivalent amount with respect to any eligible-self employed individual under section 9642 [set out above] shall not be take [sic] into account in determining the qualified family leave equivalent amount with respect to such individual under this section.
      “(d)  Credit Refundable.⁠—
      “(1)  In general.⁠—The credit determined under this section shall be treated as a credit allowed to the taxpayer under subpart C of part IV of subchapter A of chapter 1 of such Code.
      “(2)  Treatment of payments.⁠—For purposes of section 1324 of title 31, United States Code, any refund due from the credit determined under this section shall be treated in the same manner as a refund due from a credit provision referred to in subsection (b)(2) of such section.
      “(e)  Special Rules.⁠—
      “(1)  Documentation.⁠—No credit shall be allowed under this section unless the individual maintains such documentation as the Secretary may prescribe to establish such individual as an eligible self-employed individual.
      “(2)  Denial of double benefit.⁠—In the case of an individual who receives wages (as defined in section 3121(a) of the Internal Revenue Code of 1986) or compensation (as defined in section 3231(e) of such Code) paid by an employer which are required to be paid by reason of the Emergency Family and Medical Leave Expansion Act, the qualified family leave equivalent amount otherwise described in subsection (c) of this section shall be reduced (but not below zero) to the extent that the sum of the amount described in such subsection and in section 3132(b)(1) of such Code exceeds $12,000.
