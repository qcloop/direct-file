      “(ii)  67 percent (100 percent in the case of any day of paid sick time described in paragraph (1), (2), or (3) of section 5102(a) of the Emergency Paid Sick Leave Act ) of the average daily self-employment income of the individual for the taxable year.
      “(2)  Average daily self-employment income.⁠—For purposes of this subsection, the term ‘average daily self-employment income’ means an amount equal to⁠—
      “(A)  the net earnings from self-employment of the individual for the taxable year, divided by
      “(B)  260.
      “(3)  Election to use prior year net earnings from self-employment income.⁠—In the case of an individual who elects (at such time and in such manner as the Secretary may provide) the application of this paragraph, paragraph (2)(A) shall be applied by substituting ‘the prior taxable year’ for ‘the taxable year’.
      “(4)  Election to not take days into account.⁠—Any day shall not be taken into account under paragraph (1)(A) if the eligible self-employed individual elects (at such time and in such manner as the Secretary may prescribe) to not take such day into account for purposes of such paragraph.
      “(d)  Credit Refundable.⁠—
      “(1)  In general.⁠—The credit determined under this section shall be treated as a credit allowed to the taxpayer under subpart C of part IV of subchapter A of chapter 1 of such Code.
      “(2)  Treatment of payments.⁠—For purposes of section 1324 of title 31, United States Code, any refund due from the credit determined under this section shall be treated in the same manner as a refund due from a credit provision referred to in subsection (b)(2) of such section.
      “(e)  Special Rules.⁠—
      “(1)  Documentation.⁠—No credit shall be allowed under this section unless the individual maintains such documentation as the Secretary may prescribe to establish such individual as an eligible self-employed individual.
      “(2)  Denial of double benefit.⁠—In the case of an individual who receives wages (as defined in section 3121(a) of the Internal Revenue Code of 1986) or compensation (as defined in section 3231(e) of such Code) paid by an employer which are required to be paid by reason of the Emergency Paid Sick Leave Act, the qualified sick leave equivalent amount otherwise determined under subsection (c) of this section shall be reduced (but not below zero) to the extent that the sum of the amount described in such subsection and in section 3131(b)(1) of such Code exceeds $2,000 ($5,110 in the case of any day any portion of which is paid sick time described in paragraph (1), (2), or (3) of section 5102(a) of the Emergency Paid Sick Leave Act).
