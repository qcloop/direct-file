    title: "Form 8995 taxable income before QBI correction"
    pages:
      - 1
    heading: "Line 11"
    text: |
      Line 11
      Enter your taxable income figured before any QBI deduction, computed as follows.
      Form 1040 or 1040-SR filers: Form 1040 or 1040-SR, line 11a, minus lines 12e and 13b.
      1040-NR filers: 1040-NR, line 11a, minus lines 12, 13b, and 13c.
