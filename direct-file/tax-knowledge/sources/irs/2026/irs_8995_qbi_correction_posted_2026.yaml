    text: |
      If you viewed, printed, or downloaded the 2025 Instructions for Form 8995 prior to Jan. 27, 2026, please note the following corrections to page 4.
      On page 4, line 11, of the Instructions for Form 8995, the language on how to calculate taxable income before QBI deduction was incorrect for the first two bullets. The corrected instructions are below.
