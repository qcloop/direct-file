    text: |
      If you viewed, printed, or downloaded the 2025 Instructions for Form 8995-A prior to Jan. 27, 2026, please note the following corrections to page 5.
      Under Specific Instructions, the language on how to calculate taxable income before QBI deduction was incorrect for the first two bullets. The corrected instructions are below.
      Taxable income before QBI deduction. Form 8995-A, Part III, Part IV, and Schedule A (Form 8995-A) each ask for your taxable income figured without regard to the QBI deduction. Enter your taxable income figured before any QBI deduction, computed as follows.
      Form 1040 or 1040-SR filers: Form 1040 or 1040-SR, line 11a, minus lines 12e and 13b.
      1040-NR filers: 1040-NR, line 11a, minus lines 12, 13b, and 13c.
