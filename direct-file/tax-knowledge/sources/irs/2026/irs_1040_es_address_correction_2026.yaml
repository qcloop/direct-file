    text: |
      If you downloaded or printed Form 1040-ES prior to Feb. 13, 2026, the address where you should mail your estimated tax payment voucher may have changed. The 2026 Form 1040-ES has been updated to reflect the correction.
      Here is the correct list of states and mailing addresses for estimated tax payment vouchers:
      If you live in… Then send it to…
      Alabama, Alaska, Arizona, California, Colorado, Florida, Georgia, Hawaii, Idaho, Kansas, Louisiana, Michigan, Mississippi, Montana, Nebraska, Nevada, New Mexico, North Carolina, North Dakota, Ohio, Oregon, Pennsylvania, South Carolina, South Dakota, Tennessee, Texas, Utah, Washington, Wyoming Internal Revenue Service
      P.O. Box 1300
