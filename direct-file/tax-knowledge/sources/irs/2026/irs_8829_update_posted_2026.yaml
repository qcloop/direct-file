    heading: "Line 17"
    text: |
      Line 17
      Taxpayers itemizing deductions on Schedule A was updated to replace the incorrect reference to “line 10” of the Line 11 Worksheet with “line 11.” The text now reads: “If you used the Line 11 Worksheet to figure the amount to include in column (a) of line 11, then include the amount from line 11 of the Line 11 Worksheet in column (a) of line 17; otherwise, do not enter an amount on line 17.”
