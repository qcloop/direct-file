      Worksheet 2. Recoveries of Itemized Deductions (Keep for Your Records.)
      To determine whether you should complete this worksheet to figure the part of a recovery amount to include in income on your 2025
      tax return, see Itemized Deduction Recoveries. You generally don’t need to use this worksheet if you file Form 1040 or 1040-SR and
      the recovery is for state or local income taxes paid for the immediately preceding tax year. If you recovered amounts from more than
      1 year, such as a state income tax refund from 2024 and a casualty loss reimbursement from 2023, complete a separate worksheet
      for each year. Use information from your tax return for the year the expense was deducted.
      A recovery is included in income only to the extent of the deduction amount that reduced your tax in the prior year (year of the
      deduction). If you were subject to the AMT or your tax credits reduced your tax to zero, see Unused tax credits and Subject to AMT
      under Itemized Deduction Recoveries. If your recovery was for an itemized deduction that was limited, you should read Itemized
      deductions limited under Itemized Deduction Recoveries.
      NOTE: Before completing lines 1a and 1b, see Worksheet 2a, Computations for Worksheet 2, Lines 1a and 1b.
      1a. State/local income tax refund or credit1 . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . 1a.
      1b. State/local real estate and personal property taxes1 . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . 1b.
      2. Enter the total of all other Schedule A (Form 1040) refunds or reimbursements (excluding the
      amounts you entered on lines 1a and 1b)2 . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . 2.
      3. Add lines 1a, 1b, and 2 . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . 3.
      4. Ite•mized deductions for the prior year. For 2024:
      • Schedule A (Form 1040), line 17
      Schedule A (Form 1040-NR), line 8 . . . . . . . . . . . . . . . . . . . . . . . . . . . . 4.
      5. Enter any amount previously refunded to you (don’t enter an amount from
      line 1a, 1b, or 2) . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . 5.
      6. Subtract line 5 from line 4 . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . 6.
      7. Standard deduction for the prior year.3 If you filed Form 1040-NR,
      enter -0- . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . 7.
      8. Subtract line 7 from line 6. If the result is zero or less, stop here. The amounts on lines 1a, 1b, and 2
      aren’t taxable . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . 8.
      9. Enter the smaller of line 3 or line 8 . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . 9.
      10. Taxable income for prior year4 (2024 Form 1040, line 15; or 2024 Form
      1040-NR, line 15) . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . 10.
      11. A•mount to include in income for 2025:
      • If line 10 is zero or more, enter the amount from line 9.
      If line 10 is a negative amount, add lines 9 and 10 and enter the result (but not less than
      zero)5 . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . 11.
      If line 11 equals line 3:
      Enter the amount from line 1a on Schedule 1 (Form 1040), line 1; or
      Enter the amounts from lines 1b and 2 on Schedule 1 (Form 1040), line 8z.
      If line 11 is less than line 3 and either line 1a or line 1b or line 2 is zero:
      If there is an amount on line 1a, enter the amount from line 11 on Schedule 1 (Form 1040), line 1; or
      If there is an amount on lines 1b and/or 2, enter the amount from line 11 on Schedule 1 (Form 1040), line 8z.
      If line 11 is less than line 3, and there are amounts on line 1a and on line 1b or 2, complete the following
      worksheet.
      A. Divide the amount on line 1a by the amount on line 3. Enter the
      percentage . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . A.
      B. Multiply the amount on line 11 by the percentage on line A. Enter the result here and on Schedule
      1 (Form 1040), line 1 . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . B.
      C. Subtract the amount on line B from the amount on line 11. Enter the result here and on Schedule
      1 (Form 1040), line 8z . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . C.
