      Future Developments
      For the latest information about developments
      related to Pub. 525, such as legislation enacted
      after it was published, go to IRS.gov/Pub525.
      What’s New
      Overtime. If you received overtime compensa-
      tion, you may be able to claim a deduction for
      the pay that exceeds your regular rate of pay.
      See Overtime, later.
      Tips. If you received tips, you may be able to
      claim a deduction for qualified tips on your tax
      return. See Tips, later.
      Deferred compensation contribution limit
      increased. If you participate in a 401(k) plan,
      403(b) plan, or the federal government’s Thrift
      Savings Plan (TSP), the total annual amount
      you can contribute is increased to:
      • $23,500,
      • $31,000 if age 50 or older, or
      • $34,750 if age 60 through 63 at the end of
      2025.
      This also applies to most 457 plans.
      Health flexible spending arrangements
      (health FSAs) under cafeteria plans. For tax
      years beginning in 2025, the dollar limitation un-
      der section 125(i) on voluntary employee salary
      reductions for contributions to health FSAs is
      $3,300.
      Reminders
      Get forms and other information faster and easier at: Qualified wildfire relief payments are not
