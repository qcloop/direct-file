      Future Developments
      Publication 570 For the latest information about developments related to
      Pub. 570, such as legislation enacted after it was
      Tax Guide for published, go to IRS.gov/Pub570.
      Individuals What’s New
      No tax on tips, no tax on overtime, no tax on car loan
      With Income interest, and the enhanced deduction for seniors.  If
      you are filing a U.S. income tax return, the deductions for
      tips, overtime, passenger vehicle loan interest, and se-
      From U.S. niors may not be allowable, or may be reduced, depend-
      ing on your modified adjusted gross income, filing status,
      and the amount of your territory excluded income. See
      Territories Deductions if Territory Income Is Excluded, later. For more
      information, see the Schedule 1-A instructions found in
      the Instructions for Form 1040.
      For use in preparing Trump accounts and new Form 4547.  Recent legisla-
      2025 tion allows parents, guardians, and other authorized indi-
      Returns viduals to elect to establish a new type of individual retire-
      ment account, called a Trump account, for the exclusive
      benefit of certain children. If the child was born after 2024
      and before 2029, is a U.S. citizen, and meets certain other
      requirements, the authorized individual may also elect to
      receive a $1,000 pilot program contribution to the child's
      Trump account. Both elections can be made with the IRS
      (not a territory tax department) on Form 4547. For more
      information on Trump accounts, and to learn how to make
      these elections, see Form 4547 and its instructions or go
      to trumpaccounts.gov.
      Due date of return.  File your tax return by April 15,
      2026.
      Standard deduction amount. For 2025, the standard
      deduction amount has increased for all filers. See Stand-
      ard deduction amount, later.
      Maximum income subject to social security tax.  For
      2025, the maximum amount of self-employment income
      subject to social security tax is $176,100. The amount will
      increase to $184,500 for 2026.
      Optional methods to figure net earnings.  For 2025,
      the maximum income for using the optional methods is
      $7,240. This amount will increase to $7,560 for 2026.
      Reminders
