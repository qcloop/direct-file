      What’s New
      Additional deductions for seniors. Beginning in 2025,
      seniors age 65 or older may claim an additional deduction
      of $6,000 (or $12,000 for married couples where both
      spouses qualify).
      • The deduction is an addition to the standard or item-
      ized deduction.
      • It phases out for taxpayers with modified adjusted
      gross income (MAGI) over $75,000 (single) or
      $150,000 (married filing jointly).
      Repeal of the windfall elimination provision (WEP)
      and government pension offset (GPO). Recent legis-
      lation repealed the WEP and GPO with respect to social
      security benefits payable after 2023. For more information,
      see Social Security Fairness Act: Windfall Elimination
      Provision (WEP) and Government Pension Offset (GPO)
      update | SSA.
