      The type and rule above prints on all proofs including departmental reproduction proofs. MUST be removed before printing.
      Bill’s tax-free monthly amount is $100. (See line 4 of the
      worksheet.) If he lives to collect more than 310 monthly
      payments, he will generally have to include in his gross in-
      come the full amount of any annuity payments received af-
      ter 310 payments have been made.
      If Bill doesn’t live to collect 310 monthly payments and
      his wife begins to receive monthly payments, she will also
      exclude $100 from each monthly payment until 310 pay-
      ments (Bill’s and hers) have been collected. If she dies be-
      fore 310 payments have been made, an “Other Itemized
      Deduction” will be allowed for the unrecovered cost on her
      final income tax return.
      General Rule
      If your annuity starting date is after November 18, 1996,
      you can’t use the General Rule to figure the tax-free part
      of your CSRS or FERS annuity. If your annuity starting
      date is after July 1, 1986, but before November 19, 1996,
      you could have chosen to use either the General Rule or
      the Simplified Method. If your annuity starting date is be-
      fore July 2, 1986, you could have chosen to use the Gen-
      eral Rule only if you couldn’t use the 3-Year Rule.
      Under the General Rule, you figure the tax-free part of
      each full monthly payment by multiplying the initial gross
      monthly rate of your annuity by an exclusion percentage.
      Figuring this percentage is complex and requires the use
      of actuarial tables. For these tables and other information
      about using the General Rule, see Pub. 939.
      3-Year Rule
      If your annuity starting date was before July 2, 1986, you
      probably had to report your annuity using the 3-Year Rule.
      Under this rule, you excluded all the annuity payments
      from income until you fully recovered your cost. After your
      cost was recovered, all payments became fully taxable.
      You can’t use another rule to again exclude amounts from
      income.
      The 3-Year Rule was repealed for retirees whose annu-
      ity starting date is after July 1, 1986.
      Publication 721 (2025) 7
