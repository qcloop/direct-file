      are covered by an employer plan, multiply line 3 by 35%
      •  (0.35) (by 40% (0.40) if you are age 50 or older). . . . . . . . . . . . . . . . . . . 4.
      All others, multiply line 3 by 70% (0.70) (by 80% (0.80) if
      you are age 50 or older).
      5. Enter your compensation minus any deductions on Schedule 1 (Form 1040), line 15
      (deductible part of self-employment tax), and Schedule 1 (Form 1040), line 16
      (self-employed SEP, SIMPLE, and qualified plans). If you are the lower-income spouse,
      include your spouse's compensation reduced by their traditional IRA and Roth IRA
      contributions for this year . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . 5.
      6. Enter contributions you made, or plan to make, to your traditional IRA for 2025, but don’t
      enter more than $7,000 ($8,000 if you are age 50 or older). . . . . . . . . . . . . . . . . . . . . . . . . . . 6.
