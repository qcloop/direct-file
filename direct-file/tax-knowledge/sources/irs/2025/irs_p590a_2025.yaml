      IRA, any student loan interest deduction, or any exclusion of interest from savings bonds to be
      reported on Form 8815. See the Line 1 Worksheet in Appendix C for assistance with
      this calculation.) . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . 1. 118,000
