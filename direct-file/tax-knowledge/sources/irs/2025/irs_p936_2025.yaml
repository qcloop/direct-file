      Introduction
      This publication discusses the rules for deducting home
      mortgage interest.
      Part I contains general information on home mortgage
      interest, including points. It also explains how to report de-
      ductible interest on your tax return.
      Part II explains how your deduction for home mortgage
      interest may be limited. It contains Table 1, which is a
      worksheet you can use to figure the limit on your deduc-
      tion.
      Comments and suggestions. We welcome your com-
      ments about this publication and suggestions for future
      editions.
      You can send us comments through IRS.gov/
      FormComments. Or, you can write to the Internal Revenue
      Service, Tax Forms and Publications, 1111 Constitution
      Ave. NW, IR-6526, Washington, DC 20224.
      Although we can’t respond individually to each com-
      ment received, we do appreciate your feedback and will
      consider your comments and suggestions as we revise
      our tax forms, instructions, and publications. Don’t send
      tax questions, tax returns, or payments to the above ad-
      dress.
