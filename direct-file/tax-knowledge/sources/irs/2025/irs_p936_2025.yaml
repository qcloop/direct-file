      Reverse mortgages. A reverse mortgage is a loan
      where the lender pays you (in a lump sum, a monthly ad-
      vance, a line of credit, or a combination of all three) while
      you continue to live in your home. With a reverse mort-
      gage, you retain title to your home. Depending on the
      plan, your reverse mortgage becomes due, with interest,
      when you move, sell your home, reach the end of a
      pre-selected loan period, or die. Because reverse mort-
      gages are considered loan advances and not income, the
      amount you receive isn't taxable. Generally, any interest
      (including original issue discount) accrued on a reverse
      mortgage is considered interest on home equity debt and
      isn’t deductible.
